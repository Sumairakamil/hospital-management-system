<!DOCTYPE html>
<html>
<head>
    <title>Add Patient</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#eef2f7;
        }

        .form-card{
            max-width:600px;
            margin:auto;
            margin-top:50px;
            background:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0 10px 25px rgba(0,0,0,0.08);
        }
    </style>
</head>

<body>

<div class="form-card">

    <h2 class="mb-4 text-center">
        ➕ Add New Patient
    </h2>

    <form method="POST">

        {% csrf_token %}

        <input
            type="text"
            name="name"
            class="form-control mb-3"
            placeholder="Patient Name"
            required>

        <input
            type="number"
            name="age"
            class="form-control mb-3"
            placeholder="Age"
            required>

        <input
            type="text"
            name="disease"
            class="form-control mb-3"
            placeholder="Disease"
            required>

        <button
            type="submit"
            class="btn btn-success w-100">

            Add Patient

        </button>

    </form>

    <a href="/patients/"
       class="btn btn-dark w-100 mt-3">

       Back to Patients

    </a>

</div>

</body>
</html>
