<!DOCTYPE html>
<html>

<head>

    <title>Add Doctor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:#eef2f7;
        }

        .card{
            border:none;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.08);
        }

    </style>

</head>

<body>

<div class="container mt-5">

    <div class="card p-5">

        <a href="/" class="btn btn-dark mb-4">
            ← Dashboard
        </a>

        <h1 class="text-success mb-4">
            🩺 Add Doctor
        </h1>

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">
                    Doctor Name
                </label>

                <input type="text"
                       name="name"
                       class="form-control"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Specialization
                </label>

                <input type="text"
                       name="specialization"
                       class="form-control"
                       required>

            </div>

            <button type="submit"
                    class="btn btn-success">

                Save Doctor

            </button>

        </form>

    </div>

</div>

</body>
</html>
