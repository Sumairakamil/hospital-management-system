<!DOCTYPE html>
<html>
<head>
    <title>Doctors</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#eef2f7;
        }

        .main-card{
            background:white;
            border-radius:25px;
            padding:40px;
            box-shadow:0 10px 25px rgba(0,0,0,0.08);
            margin-top:40px;
        }

        .table{
            overflow:hidden;
            border-radius:15px;
        }

        .table thead{
            background:#198754;
            color:white;
        }

        .table tbody tr:hover{
            background:#f8f9fa;
            transition:0.3s;
        }

        .stats-card{
            border:none;
            border-radius:20px;
            box-shadow:0 5px 15px rgba(0,0,0,0.08);
        }

        .btn{
            border-radius:12px;
        }

        .doctor-icon{
            font-size:55px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="main-card">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h1 class="fw-bold text-dark">
                    🩺 Doctors Management
                </h1>

                <p class="text-muted">
                    View and manage hospital doctors
                </p>
            </div>

            <div>
                <a href="/" class="btn btn-dark">
                    ← Dashboard
                </a>

                <a href="/add_doctor/" class="btn btn-success ms-2">
                 + Add Doctor
                </a>
            </div>

        </div>

        <div class="row mb-4">

            <div class="col-md-4">

                <div class="card stats-card text-center p-4">

                    <div class="doctor-icon">
                        🩺
                    </div>

                    <h1 class="text-success">
                        {{ doctors|length }}
                    </h1>

                    <h5>Total Doctors</h5>

                </div>

            </div>

        </div>

        <table class="table table-hover table-bordered align-middle">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Doctor Name</th>
                    <th>Specialization</th>
                </tr>
            </thead>

            <tbody>

                {% for doctor in doctors %}

                <tr>
                    <td>{{ doctor.id }}</td>
                    <td>{{ doctor.name }}</td>
                    <td>
                        <span class="badge bg-success">
                            {{ doctor.specialization }}
                        </span>
                    </td>
                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
